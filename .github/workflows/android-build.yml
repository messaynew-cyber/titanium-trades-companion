name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle's real output goes to a log file AND is captured as artifact on failure,
      # so Kotlin/test errors are always visible from the Companion side.
      - name: Unit tests
        run: |
          ./gradlew testDebugUnitTest --stacktrace > /tmp/gradle.log 2>&1 || { echo "TESTS EXIT $?"; tail -n 80 /tmp/gradle.log; exit 1; }

      - name: Build debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace > /tmp/gradle.log 2>&1 || { echo "BUILD EXIT $?"; tail -n 120 /tmp/gradle.log; exit 1; }

      - name: Fail: emit Kotlin errors
        if: failure()
        run: |
          echo "===== KOTLIN e: LINES ====="
          grep -hE "^\s*e:\s" /tmp/gradle.log || true
          echo "===== WHAT WENT WRONG ====="
          grep -hA5 "What went wrong" /tmp/gradle.log || true
          mkdir -p build-log-art
          cp /tmp/gradle.log build-log-art/build.log || true
          exit 1

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: titanium-trades-debug
          path: app/build/outputs/apk/debug/app-debug.apk
        if: success()

      - name: Upload build log
        uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: build-log
          path: build-log-art
